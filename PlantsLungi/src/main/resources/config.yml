# PlantsLungi Configuration

# Growth time in ticks between stages (20 ticks = 1 second)
# 200 = 10 seconds per stage (5 stages = ~50 seconds total)
growth-ticks: 200

# Command executed when a player harvests the custom plant
# Placeholders: {player}, {amount}
balance-command: "eco give {player} {amount}"

# Chat notification on harvest
# Placeholders: {player}, {amount}
harvest-message: "&a[Plants] &e{player} &aзібрав врожай і отримав &6{amount} піратів!"

# Drop amounts based on farmer level ranges
drops:
  level-0-9: 1
  level-10-19: 2
  level-20-29: 3
  level-30-39: 4
  level-40-plus: 5

# Seed item display name
seed-name: "&2Насіння Лунгі"
seed-lore:
  - "&7Особливе рослина"
  - "&7Садіть на пашню"
  - "&7Дає від 1 до 5 піратів"

# Custom model data for the seed item (wheat seeds base)
seed-custom-model-data: 1001

# Resource pack auto-push on player join
# Upload your resourcepack.zip somewhere (e.g. GitHub Releases, own hosting)
# then paste the direct download URL below and set enabled: true
resource-pack:
  enabled: false
  url: ""
  # SHA-256 hex hash of the zip file (optional but avoids re-download on reconnect)
  sha256: ""
  # Set true to kick players who decline the pack
  required: false
  prompt: "<yellow>Встановіть текстурний пак для відображення кастомних рослин!"

# Messages
messages:
  no-farmland: "&cРослину можна садити лише на пашню!"
  plant-broken: "&cВаше рослина було знищено!"
